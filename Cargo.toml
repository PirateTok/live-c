[package]
name = "piratetok-live-c"
version = "0.4.0"
edition = "2021"
description = "C ABI bindings for piratetok-live-rs — use TikTok Live from any language with C FFI"
authors = ["Zmole Cristian"]
license = "0BSD"
repository = "https://github.com/PirateTok/live-c"
homepage = "https://piratetok.rosint.org"
readme = "README.md"

[lib]
name = "piratetok"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
piratetok-live-rs = "0.5"
prost = "0.14"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
tracing = "0.1"
